<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Enterprise Auto-Ads Fleet Master</title>
    <script type="module">
      // GitHub Pages SPA fallback script
      // This will redirect to index.html with the original path as a query param
      (function() {
        var path = window.location.pathname;
        if (path.endsWith('/') === false && path.split('/').pop().indexOf('.') === -1) {
            window.location.replace('/autoads/?/' + path.split('/').pop());
        }
      }());
    </script>
  </head>
  <body>
    <div id="root">
        <p>Redirecting to Fleet Master...</p>
    </div>
    <script>
        // Fallback redirection if the script above doesn't handle it
        window.location.replace('/autoads/');
    </script>
  </body>
</html>
