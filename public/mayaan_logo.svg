<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <!-- Honey Badger Body Shadow -->
  <path d="M50,300 Q150,250 300,280 T600,240 T900,200 L920,240 Q750,320 450,340 T50,300" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Main Body Silhouette (Black) -->
  <path d="M80,280 
    C120,240 180,220 250,230 
    C320,240 400,220 500,200 
    C600,180 700,160 800,150 
    C840,145 880,160 900,190 
    L910,220 
    C890,260 840,290 780,310 
    C700,340 500,350 300,340 
    C150,330 80,280 Z" fill="black"/>
  
  <!-- Spiky Mane (White-ish Highlights like a Honey Badger) -->
  <path d="M100,260 
    L120,230 L140,250 L160,220 L185,245 L210,215 L240,240 L270,210 L310,235 L350,205 L400,230 L450,190 L510,215 L580,175 L650,200 L730,160 L800,185 L860,155 L890,180 L880,195 L840,170 L780,190 L710,165 L630,190 L550,165 L470,185 L390,160 L310,180 L230,165 L150,180 L80,195 Z" fill="#eee" opacity="0.8"/>
  
  <!-- Roaring Face -->
  <path d="M900,190 Q920,180 940,195 L955,225 Q930,245 905,235 Z" fill="black"/>
  <!-- Mouth -->
  <path d="M925,210 Q940,215 935,230 L915,225 Z" fill="white"/>
  <!-- Eye -->
  <circle cx="918" cy="205" r="3" fill="white"/>

  <!-- "Mayaan" Script (Thick and White) -->
  <text x="480" y="300" fill="white" font-family="'Brush Script MT', cursive, sans-serif" font-size="160" text-anchor="middle" font-weight="900" style="filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.6))">Mayaan</text>
  
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eee;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
