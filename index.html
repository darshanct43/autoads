    <script>
      (function() {
        var RETRY_INTERVAL = 10000;
        var PING_TIMEOUT = 3500;
        var isOffline = false;
        var retryTimer = null;
        var countdownTimer = null;

        function pingHost(onSuccess, onFailure) {
          if (!navigator.onLine) {
            onFailure();
            return;
          }
          
          // Use a simpler HEAD request and shorter timeout for less intrusive check
          var xhr = new XMLHttpRequest();
          var completed = false;
          
          try {
            xhr.open('HEAD', '/?cb=' + Date.now(), true);
            xhr.timeout = 2500;
            
            xhr.onreadystatechange = function() {
              if (xhr.readyState >= 2) {
                if (completed) return;
                completed = true;
                if (xhr.status > 0 && xhr.status < 500) {
                  onSuccess();
                } else {
                  onFailure();
                }
                try { xhr.abort(); } catch(e) {}
              }
            };
            
            xhr.onerror = function() {
              if (!completed) { completed = true; onFailure(); }
            };
            
            xhr.ontimeout = function() {
              if (!completed) { completed = true; onFailure(); }
            };
            
            xhr.send();
          } catch (e) {
            if (!completed) { completed = true; onFailure(); }
          }
        }

        function createOverlay() {
          if (document.getElementById('autoads-network-recovery-overlay')) return;
          
          var overlayEl = document.createElement('div');
          overlayEl.id = 'autoads-network-recovery-overlay';
          overlayEl.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background-color:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;z-index:99999999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;';
          
          var card = document.createElement('div');
          card.style.cssText = 'background-color:#161b22;border:1px solid #30363d;border-radius:16px;padding:32px;width:100%;max-width:480px;box-sizing:border-box;box-shadow:0 12px 32px rgba(0,0,0,0.6);display:flex;flex-direction:column;align-items:center;gap:20px;';
          
          // Spinner element
          var spinnerContainer = document.createElement('div');
          spinnerContainer.style.cssText = 'width:56px;height:56px;position:relative;margin:10px 0;';
          
          var spinner = document.createElement('div');
          spinner.style.cssText = 'width:48px;height:48px;border:4px solid rgba(245,158,11,0.1);border-top:4px solid #f59e0b;border-radius:50%;animation:autoads-spin-rev 1s linear infinite;';
          
          var style = document.createElement('style');
          style.innerHTML = '@keyframes autoads-spin-rev { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }';
          document.head.appendChild(style);
          
          spinnerContainer.appendChild(spinner);
          card.appendChild(spinnerContainer);
          
          // Heading
          var title = document.createElement('h2');
          title.innerText = 'Waiting for internet connection...';
          title.style.cssText = 'font-size:1.4rem;font-weight:700;color:#f59e0b;margin:0;letter-spacing:0.02em;';
          card.appendChild(title);
          
          // Message Description
          var desc = document.createElement('p');
          desc.innerText = 'MXQ Device is connecting to hotspot. The application will resume automatically once connection is established.';
          desc.style.cssText = 'font-size:13.5px;color:#8b949e;line-height:1.6;margin:0;';
          card.appendChild(desc);
          
          // Status text box
          var statusText = document.createElement('div');
          statusText.id = 'autoads-recovery-status';
          statusText.innerText = 'Retrying in 10s...';
          statusText.style.cssText = 'font-size:12.5px;color:#c9d1d9;font-weight:600;background-color:#21262d;border:1px solid #30363d;padding:8px 16px;border-radius:24px;min-width:180px;';
          card.appendChild(statusText);
          
          // Retry Now button
          var retryBtn = document.createElement('button');
          retryBtn.innerText = 'Retry Now';
          retryBtn.style.cssText = 'padding:10px 20px;background-color:#f59e0b;color:#0d1117;font-weight:700;border:none;border-radius:8px;cursor:pointer;font-size:12px;text-transform:uppercase;transition:all 0.2s ease;';
          retryBtn.onclick = function() {
            performReload();
          };
          card.appendChild(retryBtn);
          
          overlayEl.appendChild(card);
          document.body.appendChild(overlayEl);
          
          // Countdown UI
          var count = 10;
          if (countdownTimer) clearInterval(countdownTimer);
          countdownTimer = setInterval(function() {
            count--;
            if (count <= 0) {
              clearInterval(countdownTimer);
              statusText.innerText = 'Blowing reload...';
            } else {
              statusText.innerText = 'Retrying in ' + count + 's...';
            }
          }, 1000);
        }

        function removeOverlay() {
          var overlay = document.getElementById('autoads-network-recovery-overlay');
          if (overlay) {
            overlay.parentNode.removeChild(overlay);
          }
          if (countdownTimer) clearInterval(countdownTimer);
        }

        function triggerReload() {
          console.log('[Network Recovery] Triggering programmatic page reload...');
          try {
            window.location.reload(true);
          } catch (e) {
            window.location.reload();
          }
        }

        function performReload() {
          if (retryTimer) clearTimeout(retryTimer);
          if (countdownTimer) clearInterval(countdownTimer);
          var el = document.getElementById('autoads-recovery-status');
          if (el) el.innerText = 'Connecting...';
          triggerReload();
        }

        function handleOffline() {
          if (isOffline) return;
          isOffline = true;
          console.warn('[Network Recovery] Boot network recovery activated - Connection lost at cold boot.');
          
          if (!document.body) {
            window.addEventListener('DOMContentLoaded', createOverlay);
          } else {
            createOverlay();
          }

          if (retryTimer) clearTimeout(retryTimer);
          retryTimer = setTimeout(function() {
            triggerReload();
          }, RETRY_INTERVAL);
        }

        function handleOnline() {
          console.log('[Network Recovery] Internal link verified active. Booting...');
          removeOverlay();
        }

        // Initialize Checks
        if (!navigator.onLine) {
          handleOffline();
        } else {
          pingHost(
            function() {
              handleOnline();
            },
            function() {
              handleOffline();
            }
          );
        }

        window.addEventListener('online', function() {
          console.log('[Network Recovery] Browser online event fired.');
          triggerReload();
        });
        
        window.addEventListener('offline', function() {
          console.warn('[Network Recovery] Browser offline event fired.');
          handleOffline();
        });
      })();
    </script>

    <script>
      (function() {
        window.__BOOT_ERRORS = [];
        window.__CURRENT_BOOT_STEP = 1;
        
        // Safety Catchers for Early Failure
        window.onerror = function(message, source, lineno, colno, error) {
          // Ignore benign cross-origin "Script error." messages caused by browser extensions or third-party script blocks
          var msgStr = String(message || '');
          if (msgStr.toLowerCase().indexOf('script error') !== -1 || !source) {
            console.warn('[Global Guard] Ignored cross-origin or extension-related script error:', msgStr, 'Source:', source);
            return true;
          }

          var errStr = msgStr + '\nFile: ' + (source ? source.replace(window.location.origin, '') : 'unknown') + ':' + lineno + ':' + colno;
          if (error && error.stack) {
            errStr += '\nStack: ' + error.stack;
          }
          window.__BOOT_ERRORS.push(errStr);
          showBootError(errStr);
          
          if (window.updateCheckpointUI) {
            window.updateCheckpointUI(window.__CURRENT_BOOT_STEP || 1, 'failed', 'Startup Interrupted by Syntax/Parse Error');
          }
          return false;
        };
        
        window.onunhandledrejection = function(event) {
          var reason = event.reason;
          var errStr = 'Unhandled rejection: ' + ((reason && (reason.stack || reason.message || reason)) || 'Unknown Exception');
          window.__BOOT_ERRORS.push(errStr);
          showBootError(errStr);
          
          if (window.updateCheckpointUI) {
            window.updateCheckpointUI(window.__CURRENT_BOOT_STEP || 1, 'failed', 'Unhandled Promise Rejection Captured');
          }
        };
        
        function showBootError(err) {
          var p = document.getElementById('error-panel');
          if (p) {
            p.style.display = 'block';
            p.innerText = p.innerText ? (p.innerText + '\n---\n' + err) : err;
          }
        }
        window.showBootError = showBootError;
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          const isPreview = location.hostname.includes('ais-pre') || location.hostname.includes('ais-dev');
          const isIFrame = window.self !== window.top;
          
          if (isLocalhost || isPreview || isIFrame) {
            console.log('[Service Worker] Skipping SW registration in localhost, preview, or iframe conditions.');
            return;
          }

          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
